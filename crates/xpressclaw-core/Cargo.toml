[package]
name = "xpressclaw-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core runtime library for xpressclaw — the AI agent OS"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
zerocopy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
bollard = { workspace = true }
tokio-cron-scheduler = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
async-stream = "0.3"
ready-agent-cog = { workspace = true }
croner = "2"
bytes = "1"
sysinfo = "0.34"
notify = "7"
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
async-imap = "0.10"
async-native-tls = "0.5"
async-std = { version = "1", features = ["default"] }
base64 = "0.22"

# Android device control — pure-Rust adb client. Optional: only pulled in
# when the `android` feature is enabled (see ADR-024). Keeps the default
# build free of its rustls/rsa/image dependency tree.
adb_client = { version = "3.2", optional = true }
# Image resize/JPEG encode for screenshots (same version adb_client already
# pulls in transitively, so no extra build cost). Used to downscale frames so
# they fit under the agent tool-output size limit.
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }

[features]
# Agentic Android device control (managed emulator or BYO device).
android = ["dep:adb_client", "dep:image"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
