name: implementation-review-loop
description: One Agent implements, an independent Agent reviews, and GitHub feedback is awaited durably.
version: 1

inputs:
  goal:
    type: string
    description: The code change to implement and review.
    required: true
  implementer:
    type: agent
    description: Agent context that owns the implementation and pull request.
    required: true
    primary: true
  reviewer:
    type: agent
    description: Independent Agent context that reviews the pull request.
    required: true
  wait_for_human_review:
    type: boolean
    default: true

flows:
  main:
    color: "#4A90D9"
    steps:
      - id: implement
        type: step
        label: Implement on a draft PR
        agent: "@implementer"
        prompt: |
          Implement this goal in the current repository:

          @goal

          Run relevant checks, commit and push the branch, and create or update
          a DRAFT pull request. Do not mark it ready yet.
        outputs:
          pull_request_url:
            type: string
            description: URL of the draft pull request.
          summary:
            type: string
            description: What changed and how it was verified.

      - id: review
        type: step
        label: Independent review
        agent: "@reviewer"
        new_session: true
        prompt: |
          Independently review the actual pull request at:

          @implement.pull_request_url

          Goal: @goal

          Use project-scoped GitHub tools to inspect the full diff and checks.
          Return verdict as exactly "approved" or "changes_requested".
        outputs:
          verdict:
            type: string
            description: approved or changes_requested.
          feedback:
            type: string
            description: Specific actionable feedback.

      - id: review_gate
        type: when
        label: Review decision
        switch: "@review.verdict"
        arms:
          - match: approved
            goto: step mark_ready
          - match: changes_requested
            continue: true
          - match: default
            goto: step review

      - id: revise
        type: step
        label: Address independent review
        agent: "@implementer"
        prompt: |
          Address this review of @implement.pull_request_url:

          @review.feedback

          Run relevant checks and push updates to the same draft pull request.
        outputs:
          summary:
            type: string
            description: Changes and verification.

      - id: repeat_review
        type: jump
        target: step review

      - id: mark_ready
        type: step
        label: Mark PR ready
        agent: "@implementer"
        prompt: |
          Independent review approved the implementation. Verify final checks
          and mark @implement.pull_request_url ready for human review.
        outputs:
          pull_request_url:
            type: string
            description: URL of the ready pull request.

      - id: human_review_gate
        type: when
        switch: "@wait_for_human_review"
        arms:
          - match: "true"
            continue: true
          - match: "false"
            goto: flow done

      - id: wait_for_review
        type: wait
        label: Wait for GitHub review activity
        agent: "@implementer"
        event: github.pull_request.activity
        resource: "@mark_ready.pull_request_url"
        timeout: 14d
        on_timeout: flow timed_out

      - id: handle_review
        type: step
        label: Address human review
        agent: "@implementer"
        prompt: |
          GitHub activity arrived for @mark_ready.pull_request_url:

          @wait_for_review

          Inspect the complete review conversation and current checks. Return
          outcome "approved" when no work remains, "changes_addressed" after
          pushing requested fixes, or "keep_waiting" for non-actionable activity.
        outputs:
          outcome:
            type: string
            description: approved, changes_addressed, or keep_waiting.
          summary:
            type: string
            description: Review result and action taken.

      - id: human_review_result
        type: when
        switch: "@handle_review.outcome"
        arms:
          - match: approved
            goto: flow done
          - match: changes_addressed
            goto: step review
          - match: keep_waiting
            goto: step wait_for_review
          - match: default
            goto: step wait_for_review

  done:
    color: "#22c55e"
    steps: []

  timed_out:
    color: "#f59e0b"
    steps: []
