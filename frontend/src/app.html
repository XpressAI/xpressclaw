<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<script>
			(() => {
				let preference = 'system';
				try {
					const stored = localStorage.getItem('xpressclaw.theme');
					if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored;
				} catch {}
				const dark = preference === 'dark'
					|| (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.dataset.theme = preference;
			})();
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon.png" />
		<title>xpressclaw</title>
		%sveltekit.head%
	</head>
	<body class="min-h-screen bg-background text-foreground antialiased" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
