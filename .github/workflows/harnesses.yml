name: Build & Push Runner Images

on:
  push:
    branches: [main]
    paths:
      - 'harnesses/**'
      - 'scripts/build-runner-images.sh'
      - 'scripts/runner-versions*.mjs'
      - 'scripts/verify-runner-images.sh'
      - '.github/workflows/harnesses.yml'
  pull_request:
    branches: [main]
    paths:
      - 'harnesses/**'
      - 'scripts/build-runner-images.sh'
      - 'scripts/runner-versions*.mjs'
      - 'scripts/verify-runner-images.sh'
      - '.github/workflows/harnesses.yml'
  workflow_dispatch:

concurrency:
  group: harness-images-${{ github.ref }}
  queue: max
  # Release jobs wait for immutable commit tags, so main builds must finish.
  # Superseded pull-request builds can still be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/xpressai

jobs:
  runner-matrix:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.versions.outputs.runners }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate pinned runner versions
        run: node --test scripts/runner-versions.test.mjs

      - name: Generate runner matrix
        id: versions
        run: echo "runners=$(node scripts/runner-versions.mjs matrix)" >> "$GITHUB_OUTPUT"

  build-native-runners:
    needs: runner-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.runner-matrix.outputs.runners) }}
        variant:
          - target: runner
            suffix: ''
          - target: runner-host
            suffix: '-docker'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: harnesses/native
          file: harnesses/native/${{ matrix.runner.dockerfile }}/Dockerfile
          target: ${{ matrix.variant.target }}
          build-args: ${{ matrix.runner.build_args }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/xpressclaw-runner-${{ matrix.runner.id }}${{ matrix.variant.suffix }}:latest
            ${{ env.REGISTRY }}/xpressclaw-runner-${{ matrix.runner.id }}${{ matrix.variant.suffix }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            io.xpressclaw.runner.version=${{ matrix.runner.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-public-runners:
    if: github.event_name != 'pull_request'
    needs: build-native-runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Verify anonymous runner access
        run: bash scripts/verify-runner-images.sh 120
