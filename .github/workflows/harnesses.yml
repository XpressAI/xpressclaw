name: Build & Push Runner Images

on:
  push:
    branches: [main]
    paths:
      - 'harnesses/**'
      - 'scripts/verify-runner-images.sh'
      - '.github/workflows/harnesses.yml'
  pull_request:
    branches: [main]
    paths:
      - 'harnesses/**'
      - 'scripts/verify-runner-images.sh'
      - '.github/workflows/harnesses.yml'
  workflow_dispatch:

concurrency:
  group: harness-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/xpressai

jobs:
  build-native-runners:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        runner:
          - codex
          - claude
          - github-copilot
          - junie
          - kimi
          - opencode
          - pi
          - qwen
          - cline
          - cursor
          - glm
          - grok
          - kilo
          - mistral-vibe
        variant:
          - target: runner
            suffix: ''
          - target: runner-host
            suffix: '-docker'
        include:
          - runner: codex
            dockerfile: codex
            build_args: ''
          - runner: claude
            dockerfile: claude
            build_args: ''
          - runner: opencode
            dockerfile: opencode
            build_args: ''
          - runner: github-copilot
            dockerfile: npm
            build_args: |
              AGENT_KIND=github-copilot
              AGENT_PACKAGE=@github/copilot@1.0.71
              AGENT_BINARY=copilot
          - runner: cline
            dockerfile: npm
            build_args: |
              AGENT_KIND=cline
              AGENT_PACKAGE=cline@3.0.38
              AGENT_BINARY=cline
          - runner: glm
            dockerfile: npm
            build_args: |
              AGENT_KIND=glm
              AGENT_PACKAGE=glm-acp-agent@1.1.4
              AGENT_BINARY=glm-acp-agent
          - runner: grok
            dockerfile: npm
            build_args: |
              AGENT_KIND=grok
              AGENT_PACKAGE=@xai-official/grok@0.2.97
              AGENT_BINARY=grok
          - runner: kilo
            dockerfile: npm
            build_args: |
              AGENT_KIND=kilo
              AGENT_PACKAGE=@kilocode/cli@7.3.54
              AGENT_BINARY=kilo
          - runner: pi
            dockerfile: npm
            build_args: |
              AGENT_KIND=pi
              AGENT_PACKAGE=pi-acp@0.0.31
              AGENT_BINARY=pi-acp
          - runner: qwen
            dockerfile: npm
            build_args: |
              AGENT_KIND=qwen
              AGENT_PACKAGE=@qwen-code/qwen-code@0.19.10
              AGENT_BINARY=qwen
          - runner: cursor
            dockerfile: binary
            build_args: |
              AGENT_KIND=cursor
              AGENT_BINARY=cursor-agent
              AGENT_PATH=dist-package/cursor-agent
              AGENT_ARCHIVE_AMD64=https://downloads.cursor.com/lab/2026.07.20-8cc9c0b/linux/x64/agent-cli-package.tar.gz
              AGENT_ARCHIVE_ARM64=https://downloads.cursor.com/lab/2026.07.20-8cc9c0b/linux/arm64/agent-cli-package.tar.gz
          - runner: junie
            dockerfile: binary
            build_args: |
              AGENT_KIND=junie
              AGENT_BINARY=junie
              AGENT_PATH=junie-app/bin/junie
              AGENT_ARCHIVE_AMD64=https://github.com/JetBrains/junie/releases/download/1966.57/junie-release-1966.57-linux-amd64.zip
              AGENT_ARCHIVE_ARM64=https://github.com/JetBrains/junie/releases/download/1966.57/junie-release-1966.57-linux-aarch64.zip
          - runner: kimi
            dockerfile: binary
            build_args: |
              AGENT_KIND=kimi
              AGENT_BINARY=kimi
              AGENT_PATH=kimi
              AGENT_ARCHIVE_AMD64=https://github.com/MoonshotAI/kimi-cli/releases/download/1.49.0/kimi-1.49.0-x86_64-unknown-linux-gnu.tar.gz
              AGENT_ARCHIVE_ARM64=https://github.com/MoonshotAI/kimi-cli/releases/download/1.49.0/kimi-1.49.0-aarch64-unknown-linux-gnu.tar.gz
              AGENT_SHA256_AMD64=6ce0b83f583c45a64cc9f51ffe7e1a8e03ee79acda69945fcf8c23341b9d892f
              AGENT_SHA256_ARM64=5ac54cabce16ede27b9d2069b9b88edee25528646e7bb5befa9980a1ca71febb
          - runner: mistral-vibe
            dockerfile: binary
            build_args: |
              AGENT_KIND=mistral-vibe
              AGENT_BINARY=vibe-acp
              AGENT_PATH=vibe-acp
              AGENT_ARCHIVE_AMD64=https://github.com/mistralai/mistral-vibe/releases/download/v2.17.1/vibe-acp-linux-x86_64-2.17.1.zip
              AGENT_ARCHIVE_ARM64=https://github.com/mistralai/mistral-vibe/releases/download/v2.17.1/vibe-acp-linux-aarch64-2.17.1.zip
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: harnesses/native
          file: harnesses/native/${{ matrix.dockerfile }}/Dockerfile
          target: ${{ matrix.variant.target }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/xpressclaw-runner-${{ matrix.runner }}${{ matrix.variant.suffix }}:latest
            ${{ env.REGISTRY }}/xpressclaw-runner-${{ matrix.runner }}${{ matrix.variant.suffix }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-public-runners:
    if: github.event_name != 'pull_request'
    needs: build-native-runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Verify anonymous runner access
        run: bash scripts/verify-runner-images.sh 120
