name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: xpressclaw-release
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node scripts/release-metadata.mjs --version)
          SHORT_SHA=$(git rev-parse --short HEAD)
          LAST_BUILD=$(
            {
              git tag -l 'beta-*' | sed -nE 's/^beta-([0-9]+)$/\1/p'
              git tag -l 'v*-build.*' | sed -nE 's/^v.*-build\.([0-9]+)$/\1/p'
            } | sort -n | tail -1
          )
          NEXT_BUILD=$((${LAST_BUILD:-0} + 1))
          TAG="v${VERSION}-build.${NEXT_BUILD}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$NEXT_BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Release: XpressClaw $VERSION build $NEXT_BUILD ($SHORT_SHA)"

  build-tauri:
    needs: release-metadata
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    env:
      XPRESSCLAW_BUILD_NUMBER: ${{ needs.release-metadata.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PRIVATE_REPOS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Stamp release metadata
        run: node scripts/release-metadata.mjs --build ${{ needs.release-metadata.outputs.build }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # System dependencies
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install Windows build deps
        if: runner.os == 'Windows'
        run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf cmake

      # macOS: install certificate for signing
      - name: Install Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Fetch Cargo dependencies
        run: cargo fetch

      # Write notarization API key before build (macOS signing requires it).
      - name: Write API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APPLE_API_KEY_CONTENT" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      # macOS: build with build.sh (Cargo + Tauri)
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: bash build.sh --skip-test --skip-docker --skip-check --target=${{ matrix.target }}

      # Windows
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: powershell -File build.ps1 --skip-docker --skip-check --target=${{ matrix.target }}

      # Linux
      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          TAURI_BUNDLES: "deb,rpm"
        run: bash build.sh --skip-test --skip-docker --skip-check --target=${{ matrix.target }}

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: xpressclaw-${{ matrix.label }}.dmg
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: xpressclaw-${{ matrix.label }}.msi
          path: target/${{ matrix.target }}/release/bundle/msi/*.msi

      - name: Upload Windows NSIS installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: xpressclaw-${{ matrix.label }}.exe
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe

      - name: Upload Linux deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: xpressclaw-${{ matrix.label }}.deb
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb

      - name: Upload Linux rpm
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: xpressclaw-${{ matrix.label }}.rpm
          path: target/${{ matrix.target }}/release/bundle/rpm/*.rpm

  pre-release:
    needs: [release-metadata, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Require public runner images
        run: bash scripts/verify-runner-images.sh 300

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts/ -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          name: "XpressClaw ${{ needs.release-metadata.outputs.version }} (build ${{ needs.release-metadata.outputs.build }})"
          body: |
            XpressClaw `${{ needs.release-metadata.outputs.version }}`, build `${{ needs.release-metadata.outputs.build }}`.

            Built from `main` at `${{ github.sha }}` (`${{ needs.release-metadata.outputs.sha }}`).

            **Downloads:**
            - macOS (Apple Silicon): `.dmg` arm64 — signed and notarized
            - macOS (Intel): `.dmg` x64 — signed and notarized
            - Windows: `.exe` NSIS installer, `.msi` MSI installer
            - Linux: `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL)
          prerelease: true
          make_latest: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
